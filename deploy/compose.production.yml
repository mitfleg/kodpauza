name: kodpauza

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER is required}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
      POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB is required}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 320m
    memswap_limit: 448m
    cpus: 0.75
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [database]

  migrate:
    image: '${KODPAUZA_API_IMAGE:?KODPAUZA_API_IMAGE is required}'
    pull_policy: always
    env_file: ['${KODPAUZA_ENV_FILE:-.env.production}']
    environment:
      NODE_ENV: production
      DATABASE_URL: '${DATABASE_URL:?DATABASE_URL is required}'
    command: ['./node_modules/.bin/prisma', 'migrate', 'deploy', '--schema', 'prisma/schema.prisma']
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.75
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    logging: *default-logging
    restart: 'no'
    init: true
    networks: [database]

  api:
    image: '${KODPAUZA_API_IMAGE:?KODPAUZA_API_IMAGE is required}'
    pull_policy: always
    env_file: ['${KODPAUZA_ENV_FILE:-.env.production}']
    environment:
      NODE_ENV: production
      API_PORT: '4000'
      DATABASE_URL: '${DATABASE_URL:?DATABASE_URL is required}'
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    memswap_limit: 384m
    cpus: 0.75
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    networks:
      edge:
        gw_priority: 1
      database: {}

  web:
    image: '${KODPAUZA_WEB_IMAGE:?KODPAUZA_WEB_IMAGE is required}'
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 224m
    memswap_limit: 320m
    cpus: 0.5
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m,mode=1777
      - /app/apps/web/.next/cache:rw,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=0700
    logging: *default-logging
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    networks: [edge]

volumes:
  postgres_data:

networks:
  edge:
    driver: bridge
  database:
    driver: bridge
    internal: true
