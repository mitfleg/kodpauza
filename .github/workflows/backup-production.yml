name: Backup production PostgreSQL

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted S3 backup and restore test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      BACKUP_S3_ENDPOINT: https://s3.twcstorage.ru
      BACKUP_S3_BUCKET: example-backup-bucket
      BACKUP_S3_REGION: ru-1
      BACKUP_S3_PREFIX: kodpauza/postgres
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ru-1
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Validate backup configuration
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY PROD_HOST PROD_USER \
            PROD_SSH_PRIVATE_KEY PROD_SSH_KNOWN_HOSTS BACKUP_ENCRYPTION_PASSPHRASE; do
            test -n "${!name}" || { echo "::error::Missing secret ${name}"; exit 1; }
          done
          test "${#BACKUP_ENCRYPTION_PASSPHRASE}" -ge 32 || {
            echo '::error::BACKUP_ENCRYPTION_PASSPHRASE must contain at least 32 characters'
            exit 1
          }
          aws --version

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Mark backup attempt on production
        run: |
          port="${PROD_SSH_PORT:-22}"
          date +%s | ssh -p "$port" "${PROD_USER}@${PROD_HOST}" \
            'umask 077; cat > /opt/kodpauza/backup.last-attempt'

      - name: Create and encrypt database dump
        id: dump
        run: |
          set -euo pipefail
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          object="${BACKUP_S3_PREFIX}/kodpauza-${timestamp}.dump.enc"
          backup="$RUNNER_TEMP/kodpauza.dump.enc"
          key="$RUNNER_TEMP/backup-passphrase"
          printf '%s' "$BACKUP_ENCRYPTION_PASSPHRASE" > "$key"
          chmod 600 "$key"
          port="${PROD_SSH_PORT:-22}"
          ssh -p "$port" "${PROD_USER}@${PROD_HOST}" \
            'docker exec kodpauza-postgres-1 sh -lc '\''pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc --no-owner --no-privileges'\''' \
            | openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 -pass file:"$key" \
            > "$backup"
          test -s "$backup"
          sha256sum "$backup" > "${backup}.sha256"
          echo "object=$object" >> "$GITHUB_OUTPUT"
          echo "backup=$backup" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted backup to Timeweb S3
        run: |
          set -euo pipefail
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp \
            "${{ steps.dump.outputs.backup }}" \
            "s3://${BACKUP_S3_BUCKET}/${{ steps.dump.outputs.object }}" \
            --only-show-errors
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp \
            "${{ steps.dump.outputs.backup }}.sha256" \
            "s3://${BACKUP_S3_BUCKET}/${{ steps.dump.outputs.object }}.sha256" \
            --only-show-errors

      - name: Download and restore into clean PostgreSQL
        run: |
          set -euo pipefail
          downloaded="$RUNNER_TEMP/downloaded.dump.enc"
          decrypted="$RUNNER_TEMP/restored.dump"
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 cp \
            "s3://${BACKUP_S3_BUCKET}/${{ steps.dump.outputs.object }}" "$downloaded" \
            --only-show-errors
          test "$(sha256sum "$downloaded" | cut -d' ' -f1)" = \
            "$(cut -d' ' -f1 "${{ steps.dump.outputs.backup }}.sha256")"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass file:"${{ steps.dump.outputs.key }}" \
            -in "$downloaded" -out "$decrypted"
          docker run -d --name kodpauza-backup-restore \
            -e POSTGRES_PASSWORD=restore-test postgres:16-alpine
          for attempt in {1..30}; do
            docker exec kodpauza-backup-restore pg_isready -U postgres && break
            test "$attempt" -lt 30 || exit 1
            sleep 1
          done
          docker exec -i kodpauza-backup-restore pg_restore \
            -U postgres -d postgres --no-owner --no-privileges < "$decrypted"
          tables="$(docker exec kodpauza-backup-restore psql -U postgres -d postgres -Atc \
            "SELECT count(*) FROM pg_tables WHERE schemaname = 'public';")"
          test "$tables" -ge 10
          echo "Restore test passed: ${tables} public tables."

      - name: Mark verified backup on production
        run: |
          port="${PROD_SSH_PORT:-22}"
          date +%s | ssh -p "$port" "${PROD_USER}@${PROD_HOST}" \
            'umask 077; cat > /opt/kodpauza/backup.last-success'

      - name: Remove backups older than 30 days
        run: |
          set -euo pipefail
          cutoff="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3api list-objects-v2 \
            --bucket "$BACKUP_S3_BUCKET" --prefix "${BACKUP_S3_PREFIX}/" \
            --query "Contents[?LastModified<=\`${cutoff}\`].Key" --output text \
            | tr '\t' '\n' \
            | while IFS= read -r key; do
                test -n "$key" && aws --endpoint-url "$BACKUP_S3_ENDPOINT" s3 rm \
                  "s3://${BACKUP_S3_BUCKET}/${key}" --only-show-errors
              done

      - name: Clean restore container and secrets
        if: always()
        run: |
          docker rm -f kodpauza-backup-restore >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/backup-passphrase" "$RUNNER_TEMP"/*.dump "$RUNNER_TEMP"/*.enc
