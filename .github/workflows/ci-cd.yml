name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kodpauza
          POSTGRES_PASSWORD: kodpauza-ci
          POSTGRES_DB: kodpauza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kodpauza -d kodpauza"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://kodpauza:kodpauza-ci@127.0.0.1:5432/kodpauza?schema=kodpauza_test
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API and shared package
        run: pnpm test

      - name: Test VS Code extension
        run: pnpm --filter kodpauza-vscode test

      - name: Build workspace
        run: pnpm build

  container-check:
    name: Check ${{ matrix.service }} image
    if: github.event_name == 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: apps/api/Dockerfile
            cache_scope: pull-request-api
            build_args: ''
          - service: web
            dockerfile: apps/web/Dockerfile
            cache_scope: pull-request-web
            build_args: |
              NEXT_PUBLIC_API_BASE_URL=https://api.example.test
              NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
              NEXT_PUBLIC_LOCAL_DEVELOPMENT=false
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  publish:
    name: Publish production images
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      api_image: ${{ steps.image_names.outputs.api }}
      api_digest: ${{ steps.api_build.outputs.digest }}
      web_image: ${{ steps.image_names.outputs.web }}
      web_digest: ${{ steps.web_build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate production build variables
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_API_BASE_URL" || {
            echo "::error::Repository variable NEXT_PUBLIC_API_BASE_URL is required"
            exit 1
          }
          test -n "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" || {
            echo "::error::Repository variable NEXT_PUBLIC_TURNSTILE_SITE_KEY is required"
            exit 1
          }

      - name: Resolve image names
        id: image_names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=ghcr.io/${owner}/kodpauza-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${owner}/kodpauza-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: API image metadata
        id: api_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image_names.outputs.api }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        id: api_build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}
          cache-from: type=gha,scope=production-api
          cache-to: type=gha,mode=max,scope=production-api
          provenance: false
          sbom: true

      - name: Attest API image
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-name: ${{ steps.image_names.outputs.api }}
          subject-digest: ${{ steps.api_build.outputs.digest }}
          push-to-registry: true

      - name: Web image metadata
        id: web_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image_names.outputs.web }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        id: web_build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.web_meta.outputs.tags }}
          labels: ${{ steps.web_meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_LOCAL_DEVELOPMENT=false
          cache-from: type=gha,scope=production-web
          cache-to: type=gha,mode=max,scope=production-web
          provenance: false
          sbom: true

      - name: Attest web image
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-name: ${{ steps.image_names.outputs.web }}
          subject-digest: ${{ steps.web_build.outputs.digest }}
          push-to-registry: true

  deploy-production:
    name: Deploy production
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate deploy settings
        run: |
          test -n "$PROD_HOST" || { echo "::error::PROD_HOST is required"; exit 1; }
          test -n "$PROD_USER" || { echo "::error::PROD_USER is required"; exit 1; }
          test -n "$PROD_SSH_PRIVATE_KEY" || {
            echo "::error::PROD_SSH_PRIVATE_KEY is required"
            exit 1
          }
          test -n "$PROD_SSH_KNOWN_HOSTS" || {
            echo "::error::PROD_SSH_KNOWN_HOSTS is required"
            exit 1
          }

      - name: Configure SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload release and deploy
        env:
          API_IMAGE: ${{ needs.publish.outputs.api_image }}@${{ needs.publish.outputs.api_digest }}
          WEB_IMAGE: ${{ needs.publish.outputs.web_image }}@${{ needs.publish.outputs.web_digest }}
        run: |
          port="${PROD_SSH_PORT:-22}"
          target="${PROD_USER}@${PROD_HOST}"
          ssh -p "$port" "$target" "test -d /opt/kodpauza && test -w /opt/kodpauza"
          scp -P "$port" deploy/compose.production.yml \
            "$target:/opt/kodpauza/compose.production.next.yml"
          printf 'KODPAUZA_API_IMAGE=%s\nKODPAUZA_WEB_IMAGE=%s\n' \
            "$API_IMAGE" "$WEB_IMAGE" > "$RUNNER_TEMP/release.env"
          scp -P "$port" "$RUNNER_TEMP/release.env" \
            "$target:/opt/kodpauza/release.next.env"
          ssh -p "$port" "$target" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/kodpauza
          test -f .env.production
          if test -f release.env; then
            cp release.env release.previous.env
          fi
          if test -f compose.production.yml; then
            cp compose.production.yml compose.previous.yml
          fi
          mv compose.production.next.yml compose.production.yml
          mv release.next.env release.env

          compose() {
            docker compose \
              --env-file .env.production \
              --env-file release.env \
              -f compose.production.yml "$@"
          }

          compose config --quiet
          compose pull
          compose up -d --remove-orphans
          compose ps

          if ! curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            http://127.0.0.1:4000/ready >/dev/null ||
            ! curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            http://127.0.0.1:3000/ >/dev/null; then
            echo "Healthcheck failed; rolling back images" >&2
            if test -f release.previous.env; then
              cp release.previous.env release.env
              if test -f compose.previous.yml; then
                cp compose.previous.yml compose.production.yml
              fi
              compose pull
              compose up -d --remove-orphans
            fi
            exit 1
          fi
          REMOTE
