name: Publish VS Code extension

on:
  push:
    tags:
      - 'extension-v*'

permissions:
  contents: read

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

env:
  EXTENSION_ARTIFACT: kodpauza-vscode-${{ github.ref_name }}
  VSIX_PATH: packages/vscode-extension/dist/kodpauza.vsix

jobs:
  package:
    name: Test and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          node <<'NODE'
          const pkg = require('./packages/vscode-extension/package.json');
          const expectedTag = `extension-v${pkg.version}`;

          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            console.error(
              `::error::Release tag ${process.env.GITHUB_REF_NAME} does not match package version ${pkg.version}. Expected ${expectedTag}.`,
            );
            process.exit(1);
          }
          NODE

      - name: Test extension
        run: pnpm --filter kodpauza-vscode test

      - name: Build VSIX
        run: pnpm --filter kodpauza-vscode package:vsix

      - name: Verify VSIX archive
        run: |
          test -s "$VSIX_PATH"
          unzip -t "$VSIX_PATH"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.EXTENSION_ARTIFACT }}
          path: ${{ env.VSIX_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-vscode-marketplace:
    name: Publish to VS Code Marketplace
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Validate publishing token
        run: test -n "$VSCE_PAT" || { echo "::error::Repository secret VSCE_PAT is required"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Download VSIX artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.EXTENSION_ARTIFACT }}
          path: dist

      - name: Publish extension
        run: pnpm dlx @vscode/vsce@3.6.2 publish --packagePath dist/kodpauza.vsix

  publish-open-vsx:
    name: Publish to Open VSX
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Validate publishing token
        run: test -n "$OVSX_PAT" || { echo "::error::Repository secret OVSX_PAT is required"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Download VSIX artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ env.EXTENSION_ARTIFACT }}
          path: dist

      - name: Publish extension
        run: pnpm dlx ovsx@1.0.2 publish dist/kodpauza.vsix
