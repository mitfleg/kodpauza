name: Publish VS Code extension

on:
  push:
    tags:
      - 'extension-v*'

permissions:
  contents: write

concurrency:
  group: publish-extension-${{ github.ref }}
  cancel-in-progress: false

env:
  VSIX_PATH: packages/vscode-extension/dist/kodpauza.vsix

jobs:
  package:
    name: Test and package extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          node <<'NODE'
          const pkg = require('./packages/vscode-extension/package.json');
          const expectedTag = `extension-v${pkg.version}`;

          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            console.error(
              `::error::Release tag ${process.env.GITHUB_REF_NAME} does not match package version ${pkg.version}. Expected ${expectedTag}.`,
            );
            process.exit(1);
          }
          NODE

      - name: Test extension
        run: pnpm --filter kodpauza-vscode test

      - name: Build VSIX
        run: pnpm extension:package

      - name: Verify VSIX archive
        run: |
          test -s "$VSIX_PATH"
          unzip -t "$VSIX_PATH"

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          test -n "$OVSX_PAT" || { echo "::error::Repository secret OVSX_PAT is required"; exit 1; }
          pnpm dlx ovsx@1.0.2 publish "$VSIX_PATH"

      - name: Publish to VS Code Marketplace
        if: ${{ vars.ENABLE_VSCODE_MARKETPLACE_PUBLISH == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          test -n "$VSCE_PAT" || { echo "::error::Repository secret VSCE_PAT is required"; exit 1; }
          pnpm exec vsce publish --packagePath "$VSIX_PATH"

      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#extension-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX_PATH#kodpauza.vsix" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX_PATH#kodpauza.vsix" \
              --verify-tag \
              --title "Kodpauza VS Code ${version}" \
              --notes "Автоматическая сборка расширения Kodpauza ${version}."
          fi
